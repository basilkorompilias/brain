[project]
name = "brand-brain"
version = "0.1.0"
description = "Brand Brain — a multi-brand MCP server that lets any creative chat with a client's brand voice and generate on-brand work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brand-brain = "brand_brain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brand_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
